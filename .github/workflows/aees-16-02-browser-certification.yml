name: AEES-16-02 Browser Certification

on:
  push:
    branches:
      - dev
    paths:
      - .github/workflows/aees-16-02-browser-certification.yml
  workflow_dispatch:

jobs:
  browser-certification:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AEES_CERTIFIED_GIT_SHA: 793588519503c5a4e5ca9d37516e60e8f98ecd55
      AEES_BROWSER_BASE_URL: https://acs-myigjjyor-axodus.vercel.app

    steps:
      - name: Checkout orchestration commit
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Verify certified implementation commit exists
        run: |
          git fetch --depth=1 origin "$AEES_CERTIFIED_GIT_SHA"
          git cat-file -e "$AEES_CERTIFIED_GIT_SHA^{commit}"

      - name: Install core dependencies
        run: npm ci

      - name: Build core
        run: npm run build

      - name: Run AEES-16-02 targeted tests
        run: node --test tests/s62-epic-16-2-economic-authorization-reservations.test.mjs

      - name: Install Playwright runtime
        run: |
          npm install --no-save playwright@1.62.1
          npx playwright install --with-deps chromium

      - name: Resolve Chromium executable
        run: echo "AEES_BROWSER_EXECUTABLE_PATH=$(node -e \"const { chromium } = require('playwright'); process.stdout.write(chromium.executablePath())\")" >> "$GITHUB_ENV"

      - name: Preflight exact Vercel deployment
        run: |
          curl --fail --show-error --silent "$AEES_BROWSER_BASE_URL/operations/overview" >/dev/null

      - name: Execute AEES-16-02 remote browser certification
        run: node scripts/certify-aees-16-02-browser-recovery.mjs

      - name: Validate manifest
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = '/tmp/acs-aees-16-02-browser-recovery/manifest.json';
          const manifest = JSON.parse(fs.readFileSync(path, 'utf8'));
          const failures = [];
          if (manifest.result !== 'PASS') failures.push('result');
          if (manifest.preflight?.status !== 'ok') failures.push('preflight');
          if (!Array.isArray(manifest.browser?.checks) || manifest.browser.checks.length !== 6) failures.push('viewportThemeMatrix');
          if (manifest.browser?.accessibilityFailures !== 0) failures.push('accessibility');
          if (manifest.browser?.horizontalOverflow !== 0) failures.push('horizontalOverflow');
          if (manifest.browser?.consoleErrors !== 0) failures.push('consoleErrors');
          if (manifest.browser?.pageErrors !== 0) failures.push('pageErrors');
          if ((manifest.browser?.requestFailures?.length ?? 0) !== 0) failures.push('requestFailures');
          if (manifest.noFakeData?.syntheticMarkers !== 0) failures.push('syntheticMarkers');
          if (manifest.noFakeData?.historicalTexts !== 0) failures.push('historicalTexts');
          if (manifest.noFakeData?.tokenInBrowserStorage !== 0) failures.push('tokenInBrowserStorage');
          if (failures.length) {
            console.error('AEES-16-02 certification failed:', failures.join(', '));
            process.exit(1);
          }
          console.log('AEES-16-02 remote browser manifest: PASS');
          NODE

      - name: Write certification metadata
        if: always()
        run: |
          cat > /tmp/acs-aees-16-02-browser-recovery/certification-metadata.json <<EOF
          {
            "certifiedGitSha": "$AEES_CERTIFIED_GIT_SHA",
            "deploymentUrl": "$AEES_BROWSER_BASE_URL",
            "orchestrationGitSha": "$GITHUB_SHA",
            "runner": "github-actions/ubuntu-latest"
          }
          EOF

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aees-16-02-browser-evidence
          path: /tmp/acs-aees-16-02-browser-recovery/
          if-no-files-found: error
