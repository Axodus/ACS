name: AEES-16-02 Browser Certification

on:
  push:
    branches:
      - dev
    paths:
      - .github/workflows/aees-16-02-browser-certification.yml
  workflow_dispatch:

jobs:
  browser-certification:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install core dependencies
        run: npm ci

      - name: Build core
        run: npm run build

      - name: Run AEES-16-02 targeted tests
        run: node --test tests/s62-epic-16-2-economic-authorization-reservations.test.mjs

      - name: Install static app dependencies
        working-directory: static
        run: npm ci

      - name: Build static app
        working-directory: static
        run: npm run build

      - name: Install Playwright runtime for recovery harness
        run: |
          npm install --no-save playwright@1.62.1
          npx playwright install --with-deps chromium

      - name: Start browser target
        run: |
          nohup npm --prefix static run preview -- --host 127.0.0.1 --port 3000 > /tmp/acs-static-preview.log 2>&1 &
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/operations/overview >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/acs-static-preview.log
          exit 1

      - name: Execute AEES-16-02 browser recovery
        env:
          AEES_BROWSER_BASE_URL: http://127.0.0.1:3000
        run: node scripts/certify-aees-16-02-browser-recovery.mjs

      - name: Validate manifest
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = '/tmp/acs-aees-16-02-browser-recovery/manifest.json';
          const manifest = JSON.parse(fs.readFileSync(path, 'utf8'));
          const failures = [];
          if (manifest.accessibility !== 'PASS') failures.push('accessibility');
          if (manifest.horizontalOverflow !== 0) failures.push('horizontalOverflow');
          if (manifest.consoleErrors !== 0) failures.push('consoleErrors');
          if (manifest.pageErrors !== 0) failures.push('pageErrors');
          if (manifest.noFakeData !== 'PASS') failures.push('noFakeData');
          if (!Array.isArray(manifest.routes) || manifest.routes.length !== 6) failures.push('routeMatrix');
          if (manifest.routes?.some(r => r.status !== 200 || r.overflow !== 0)) failures.push('routeStatusOrOverflow');
          if (failures.length) {
            console.error('AEES-16-02 certification failed:', failures.join(', '));
            process.exit(1);
          }
          console.log('AEES-16-02 browser manifest: PASS');
          NODE

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aees-16-02-browser-evidence
          path: /tmp/acs-aees-16-02-browser-recovery/
          if-no-files-found: warn

      - name: Upload preview log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aees-16-02-browser-preview-log
          path: /tmp/acs-static-preview.log
          if-no-files-found: warn
