name: Deploy ACS control plane to GitHub Pages

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout application source without runtime submodules
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.3.4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm
          cache-dependency-path: .design/app-standalone/pnpm-lock.yaml

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install frontend dependencies
        working-directory: .design/app-standalone
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        working-directory: .design/app-standalone
        env:
          VITE_ACS_ENVIRONMENT: development
          VITE_ACS_API_BASE_URL: https://acs-axodus.up.railway.app/api/v1
          VITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: pnpm build

      - name: Add SPA fallback
        working-directory: .design/app-standalone
        run: cp dist/index.html dist/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .design/app-standalone/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
